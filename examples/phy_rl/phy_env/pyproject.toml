[project]
name = "phy-env"
version = "0.1.0"
description = "Physics RLVR taskset for prime-rl"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets",
    "physics-rlvr-common",
    "verifiers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phy_env"]

[tool.uv.sources]
physics-rlvr-common = { path = "../shared", editable = true }
