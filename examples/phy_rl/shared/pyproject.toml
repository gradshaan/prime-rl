[project]
name = "physics-rlvr-common"
version = "0.1.0"
description = "Shared answer schema and deterministic physics answer verifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "antlr4-python3-runtime==4.11.*",
    "pint>=0.24,<1",
    "sympy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physics_rlvr_common"]
