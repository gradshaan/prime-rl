# RLVR on verifiable physics: Qwen/Qwen3-4B, 2 trainer GPUs + 4 inference GPUs.
#   uv sync --all-extras --package prime-rl --package phy-env
#   uv run rl @ examples/phy_rl/rl.toml --run.name phy-rl-qwen3-4b

max_steps = 500
seq_len = 20480

[model]
name = "Qwen/Qwen3-4B"

[deployment]
num_train_gpus = 2
num_infer_gpus = 4

[monitors.wandb]
project = "phy-rl"

[ckpt]
interval = 50

[orchestrator]
batch_size = 256 # 16 problems x 16 rollouts

[orchestrator.train]
group_size = 16

[orchestrator.train.sampling]
# Qwen3-8B used about 7k tokens on the median problem and 40% of replies went past 8k
max_completion_tokens = 16384

[[orchestrator.train.source]]
name = "phy-train"
select.shuffle = true # rows are grouped by problem family
env.taskset.id = "phy-env"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 50

[orchestrator.eval.sampling]
max_completion_tokens = 16384
temperature = 0.6
top_p = 0.95
top_k = 20

[[orchestrator.eval.source]]
name = "phy-dev"
group_size = 4
env.taskset.id = "phy-env"
env.taskset.split = "dev"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 1e-6

[inference.vllm]
max_model_len = 20480
# Eval uses chat completions; without the parser a <final> written while thinking scores 0
reasoning_parser = "qwen3"
