# Smoke test of the full pipeline: 5 short steps on 1 trainer GPU + 1 inference GPU.
#   uv run rl @ examples/phy_rl/test.toml --run.name phy-rl-test

max_steps = 5
seq_len = 6144

[model]
name = "Qwen/Qwen3-4B"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[monitors.wandb]
project = "phy-rl"

[orchestrator]
batch_size = 32

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 4096

[[orchestrator.train.source]]
name = "phy-train"
select.shuffle = true
env.taskset.id = "phy-env"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 5

[orchestrator.eval.sampling]
max_completion_tokens = 4096

[[orchestrator.eval.source]]
name = "phy-dev"
select.limit = 16
env.taskset.id = "phy-env"
env.taskset.split = "dev"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 1e-6

[inference.vllm]
max_model_len = 6144
reasoning_parser = "qwen3"
